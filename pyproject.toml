[project]
name = "claims-and-authorization-data-quality-anomaly-monitor"
version = "0.1.0"
description = "Healthcare data quality anomaly detection platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

# ── Pyrefly (IDE type checker) ─────────────────────────────────────────────
[tool.pyrefly]
# project_root tells pyrefly the import root so `app.*` resolves from backend/
project_root = "backend"

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
